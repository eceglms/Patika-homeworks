<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kodluyoruz | Yapılacaklar Listesi</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (sil/işaret ikonları için) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{ --brand:#df842a; --dark:#2b4d59; }
    body{ background:#f5f7f9; }
    header{
      background: var(--brand);
      color:#fff;
      padding: 28px 0;
      margin-bottom: 18px;
    }
    .brand-wrap{ max-width: 980px; margin:0 auto; text-align:center; }
    .brand-logo{
      font-weight: 800; letter-spacing:.12em; font-size: 28px;
      background:#fff; color:var(--brand); padding:6px 18px; border-radius:6px;
      display:inline-block;
    }
    .brand-sub{ font-size: 22px; margin-top:6px; }
    .app{
      max-width:980px; margin: 0 auto; padding: 0 16px 32px;
    }
    .todo-item{
      background:#e9eef1; border:0; border-radius:0; color:#0f1f26;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 12px; margin-bottom:8px;
    }
    .todo-item.done{ background: var(--dark); color:#e7f2f6; text-decoration: line-through; }
    .todo-title{ flex:1; margin-left:10px; user-select:none; }
    .icon-btn{ border:0; background:transparent; color:inherit; opacity:.85; }
    .icon-btn:hover{ opacity:1; }
    .right-actions{ display:flex; gap:8px; }
  </style>
</head>
<body>

  <!-- ÜST ŞERİT -->
  <header>
    <div class="brand-wrap">
      <div class="brand-logo">KODLUYORUZ</div>
      <div class="brand-sub">Yapılacaklar Listesi</div>

      <div class="container mt-3">
        <div class="row g-2 justify-content-center">
          <div class="col-12 col-md-8">
            <input id="todo-input" class="form-control" type="text" placeholder="Bugün ne yapacaksın?">
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button id="add-btn" class="btn btn-light fw-semibold">Ekle</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ANA UYGULAMA -->
  <main class="app">
    <ul id="todo-list" class="list-unstyled mb-0"></ul>
  </main>
