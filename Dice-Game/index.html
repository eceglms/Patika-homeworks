<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Series of Dice 🎲</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1 id="result">Draw! 🤝</h1>

    <div class="players">
      <div class="player">
        <input id="player1-name" type="text" value="Player 1" />
        <img class="dice" id="dice1" src="images/dice1.png" alt="Dice 1" />
      </div>

      <div class="player">
        <p>Player 2</p>
        <img class="dice" id="dice2" src="images/dice1.png" alt="Dice 2" />
      </div>
    </div>

    <button id="roll-btn">🎲 Roll the Dice!</button>

    <footer>www 🎲 Dice Game 🎲 com</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
