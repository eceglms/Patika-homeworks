<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bill Gates Spend App 💸</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="balance-bar">
    <h1>Spend Bill's Money</h1>
    <div id="balance" class="balance-amount">$100,000,000,000</div>
  </header>

  <main class="container">
    <section id="products" class="products"></section>

    <section class="receipt">
      <h2>Your Receipt</h2>
      <ul id="receipt-list" class="receipt-list"></ul>
      <div class="receipt-total">
        <span>Total</span>
        <strong id="receipt-total">$0</strong>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>Made for practice • Patika+ • World Series of Spend</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
